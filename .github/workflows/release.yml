name: release

# Push a tag v<version> (the same as package.json "version") to publish a release:
#   git tag v0.1.0 && git push origin v0.1.0
on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.5
      - run: bun install --frozen-lockfile
      - name: Tag must match package.json
        run: |
          v=$(bun -e 'console.log(require("./package.json").version)')
          [ "v$v" = "${GITHUB_REF_NAME}" ] || { echo "fail tag ${GITHUB_REF_NAME} is not v$v"; exit 1; }
      - run: bunx tsc --noEmit -p .
      - run: bunx vitest run
      - run: sh devutils/leak-scan.sh
      - name: Build all targets
        run: bun devutils/release/build.ts --release --out dist
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          notes=$(awk -v v="${GITHUB_REF_NAME#v}" '$0 ~ "^## " v { on = 1; next } /^## / { on = 0 } on' CHANGELOG.md)
          printf '%s\n' "$notes" > dist/NOTES.md
          gh release create "${GITHUB_REF_NAME}" dist/*.tar.gz dist/SHA256SUMS install.sh \
            --title "airstack ${GITHUB_REF_NAME}" --notes-file dist/NOTES.md
